<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>${subject}</title>
</head>
<body style="font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f5f7fa; margin: 0; padding: 0; color: #333; line-height: 1.6;">
<div style="max-width: 600px; margin: 20px auto; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);">
    <div style="padding: 40px;">
        <h2 style="color: #f86901; font-size: 24px; margin-top: 0; font-weight: 700;">${subject}</h2>

        <p style="font-family: 'Helvetica Neue', Arial, sans-serif; color: #333; line-height: 1.6;">Halo <span style="color: #f86901; font-weight: 600;">${username}</span>,</p>

        <div style="background: #fff9f5; border-left: 4px solid #f86901; padding: 20px; margin: 25px 0; font-style: italic; color: #666; font-family: 'Helvetica Neue', Arial, sans-serif;">
            ${message}
        </div>
    </div>

    <div style="background: #2c3e50; padding: 25px; text-align: center;">
        <img src="${logoUrl}" alt="Company Logo" style="height: 40px; margin-bottom: 15px;" />
        <p style="color: #ecf0f1; font-size: 13px; margin: 5px 0; font-family: 'Helvetica Neue', Arial, sans-serif;">© ${year} Warmakth</p>
        <p style="color: #ecf0f1; font-size: 13px; margin: 5px 0; font-family: 'Helvetica Neue', Arial, sans-serif;">Jln. Veteran, RT/RW : 02/03, Gambir, Kecamatan Gambir, Jakarta pusat, DKI Jakarta</p>
    </div>
</div>
</body>
</html>
