version: "3.9"

name: warmakth-dev

services:

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: warmakth-postgres-dev
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: rahasia
      POSTGRES_DB: warmakth-db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - warmakth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d warmakth-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: warmakth-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - warmakth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Ngrok (Expose Localhost)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: warmakth-ngrok-dev
    command: http host.docker.internal:8081
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    networks:
      - warmakth-network
    restart: unless-stopped

networks:
  warmakth-network:
    driver: bridge
    name: warmakth-network-dev

volumes:
  postgres-data:
    name: warmakth-postgres-data
  rabbitmq-data:
    name: warmakth-rabbitmq-data